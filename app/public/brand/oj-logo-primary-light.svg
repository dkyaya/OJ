<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <style>
      .brand-orange { fill: #FF6B00; }
      .candlestick-green { fill: #008736; }
      .candlestick-red { fill: #D50000; }
      .text-title-light { font-family: 'Sora', 'Inter', sans-serif; font-weight: 700; font-size: 52px; fill: #121212; letter-spacing: -0.5px; }
      .text-sub-light { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #666666; letter-spacing: 4px; text-transform: uppercase; }
    </style>
  </defs>
  <g id="Symbol" transform="translate(10, 10)">
