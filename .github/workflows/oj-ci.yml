name: OJ CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: { contents: read }
jobs:
  validate:
    name: OJ Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npm run validate:data && npm run lint && npm run typecheck
        working-directory: app
  test:
    name: OJ Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npm run test
        working-directory: app
  build:
    name: OJ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  security:
    name: OJ Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject backend secrets in public sources
        run: |
          ! rg -n "SUPABASE_SECRET_KEY|GITHUB_OJ_TOKEN|OJ_FORMALIZATION_WEBHOOK_SECRET" app/src app/public
          ! rg -n "ghp_|github_pat_|sb_secret_" app/src app/public
