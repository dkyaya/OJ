name: Deploy OJ Supabase
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ljpcgvqsrgpssqobeznp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Link and apply migrations
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" && supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        run: supabase functions deploy submit-formalization --project-ref "$PROJECT_REF" && supabase functions deploy formalization-status --project-ref "$PROJECT_REF" && supabase functions deploy reconcile-publication --project-ref "$PROJECT_REF" --no-verify-jwt
