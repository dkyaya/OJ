<!doctype html>
<html lang="en">
  <body style="margin:0;background:#171510;color:#f8f1e8;font-family:Arial,sans-serif;padding:32px;">
    <main style="max-width:520px;margin:0 auto;background:#211e19;border:1px solid #3b342b;border-radius:18px;padding:32px;">
      <h1 style="font-size:28px;line-height:1.1;margin:0 0 18px;">You’re Invited</h1>
      <p style="font-size:16px;line-height:1.5;margin:0 0 24px;">You’ve been invited to OJ.</p>
      <p style="font-size:13px;line-height:1.4;margin:0 0 8px;color:#bdb3a7;">Activation code</p>
      <p style="font-family:monospace;font-size:30px;font-weight:700;letter-spacing:0.2em;margin:0 0 28px;color:#ff7a1a;">{{ .Token }}</p>
      <p style="font-size:16px;line-height:1.5;margin:0 0 22px;">Open OJ to activate your account.</p>
      <a href="https://dkyaya.github.io/OJ/?auth=activate" style="display:inline-block;background:#ff7a1a;color:#171510;text-decoration:none;font-weight:700;border-radius:10px;padding:13px 18px;">Open OJ</a>
      <p style="font-size:12px;line-height:1.5;margin:24px 0 0;color:#8f877e;">This code expires in one hour. Opening OJ does not use the code.</p>
    </main>
  </body>
</html>
